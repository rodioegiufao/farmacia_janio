<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conversor IFC → XKT</title>
    <link rel="icon" href="/images/favicon.ico" sizes="any" />
    <style>
        :root {
            --bg: #0f172a;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #475569;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --border: #cbd5e1;
            --ok: #166534;
            --error: #b91c1c;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: radial-gradient(circle at top, #1e293b, var(--bg));
            color: var(--text);
        }

        .card {
            width: min(100%, 740px);
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 20px 30px rgba(0, 0, 0, 0.24);
            padding: 24px;
            display: grid;
            gap: 16px;
        }

        h1 {
            margin: 0;
            font-size: 1.6rem;
        }

        p {
            margin: 0;
            color: var(--muted);
            line-height: 1.4;
        }

        .dropzone {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 28px 16px;
            text-align: center;
            background: #f8fafc;
            transition: border-color 0.2s ease;
        }

        .dropzone.dragover {
            border-color: var(--accent);
        }

        .dropzone strong {
            display: block;
            margin-bottom: 8px;
        }

        .dropzone input {
            display: none;
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        button,
        .button-link {
            border: 0;
            border-radius: 10px;
            padding: 12px 14px;
            cursor: pointer;
            font-weight: 700;
            text-decoration: none;
            color: #fff;
            background: var(--accent);
            transition: background 0.2s ease;
        }

        button:hover,
        .button-link:hover {
            background: var(--accent-hover);
        }

        button[disabled] {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .button-link {
            background: #334155;
        }

        .status {
            font-size: 0.95rem;
            min-height: 22px;
        }

        .status.ok { color: var(--ok); }
        .status.error { color: var(--error); }

        .file-name {
            font-size: 0.95rem;
            color: var(--muted);
            overflow-wrap: anywhere;
        }

        .progress {
            width: 100%;
            height: 10px;
            border-radius: 999px;
            background: #e2e8f0;
            overflow: hidden;
        }

        .progress > span {
            display: block;
            height: 100%;
            width: 0;
            background: var(--accent);
            transition: width 0.2s linear;
        }

        code {
            background: #f1f5f9;
            padding: 2px 6px;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <main class="card" aria-labelledby="pageTitle">
        <h1 id="pageTitle">Conversor IFC → XKT</h1>
        <p>
            Selecione um arquivo <code>.ifc</code>, converta no navegador e baixe o <code>.xkt</code>.
            Para arquivos muito grandes, prefira a conversão no servidor/CLI.
        </p>

        <label id="dropzone" class="dropzone" for="ifcFileInput">
            <strong>Arraste e solte o arquivo IFC aqui</strong>
            <span>ou clique para selecionar</span>
            <input id="ifcFileInput" type="file" accept=".ifc" />
        </label>

        <div id="selectedFileName" class="file-name">Nenhum arquivo selecionado.</div>

        <div class="progress" aria-hidden="true">
            <span id="progressFill"></span>
        </div>

        <div class="actions">
            <button id="convertButton" type="button" disabled>Converter para XKT</button>
            <a class="button-link" href="/3D/index.html">Voltar para projetos 3D</a>
        </div>

        <div id="status" class="status" aria-live="polite"></div>
    </main>

    <script type="module">
        import * as WebIFC from "https://cdn.jsdelivr.net/npm/web-ifc@0.0.34/web-ifc-api.js";
        const XKT_UTILS_IMPORT_CANDIDATES = [
            "https://cdn.jsdelivr.net/npm/@xeokit/xeokit-convert/dist/xeokit-convert.es.js",
            "https://unpkg.com/@xeokit/xeokit-convert/dist/xeokit-convert.es.js"
        ];
        const PAKO_IMPORT_CANDIDATES = [
            "https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.esm.mjs",
            "https://unpkg.com/pako@2.1.0/dist/pako.esm.mjs"
        ];
        const ZIP_OUTPUT = false;
        
        const WASM_PATH = "https://cdn.jsdelivr.net/npm/web-ifc@0.0.34/";

        const ifcFileInput = document.getElementById("ifcFileInput");
        const dropzone = document.getElementById("dropzone");
        const selectedFileName = document.getElementById("selectedFileName");
        const convertButton = document.getElementById("convertButton");
        const statusElement = document.getElementById("status");
        const progressFill = document.getElementById("progressFill");

        let selectedFile = null;
        let xktUtils = null;
        let pakoUtils = null;

        async function loadXktUtils() {
            if (xktUtils) {
                return xktUtils;
            }

            let lastError = null;

            for (const url of XKT_UTILS_IMPORT_CANDIDATES) {
                try {
                    const imported = await import(url);
                    if (
                        imported?.XKTModel &&
                        imported?.parseIFCIntoXKTModel &&
                        imported?.writeXKTModelToArrayBuffer
                    ) {
                        xktUtils = imported;
                        return xktUtils;
                    }
                } catch (error) {
                    lastError = error;
                }
            }

            throw new Error(
                `Não foi possível carregar a biblioteca xeokit-xkt-utils. Detalhe: ${lastError?.message || lastError || "desconhecido"}`
            );
        }


        async function loadPakoUtils() {
            if (pakoUtils) {
                return pakoUtils;
            }

            let lastError = null;

            for (const url of PAKO_IMPORT_CANDIDATES) {
                try {
                    const imported = await import(url);
                    if (imported?.deflate || imported?.gzip || imported?.zip) {
                        pakoUtils = imported;
                        return pakoUtils;
                    }
                } catch (error) {
                    lastError = error;
                }
            }

            throw new Error(
                `Não foi possível carregar a biblioteca pako. Detalhe: ${lastError?.message || lastError || "desconhecido"}`
            );
        }

        function setStatus(message, type = "") {
            statusElement.textContent = message;
            statusElement.className = `status ${type}`.trim();
        }

        function setProgress(value) {
            const safe = Math.max(0, Math.min(100, value));
            progressFill.style.width = `${safe}%`;
        }

        function baseNameWithoutExtension(fileName = "") {
            return fileName.replace(/\.[^/.]+$/, "");
        }

        function updateSelectedFile(file) {
            selectedFile = file;
            if (!file) {
                selectedFileName.textContent = "Nenhum arquivo selecionado.";
                convertButton.disabled = true;
                return;
            }

            selectedFileName.textContent = `Arquivo: ${file.name}`;
            convertButton.disabled = false;
        }

        function downloadArrayBuffer(arrayBuffer, fileName) {
            const blob = new Blob([arrayBuffer], { type: "application/octet-stream" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        }

        async function convertIfcToXkt() {
            if (!selectedFile) {
                return;
            }

            convertButton.disabled = true;
            setProgress(5);
            setStatus("Lendo arquivo IFC...", "");

            try {
                const data = await selectedFile.arrayBuffer();
                const { XKTModel, parseIFCIntoXKTModel, writeXKTModelToArrayBuffer } = await loadXktUtils();
                const pako = ZIP_OUTPUT ? await loadPakoUtils() : null;
                const xktModel = new XKTModel();

                setProgress(20);
                setStatus("Convertendo IFC para modelo XKT...", "");

                await parseIFCIntoXKTModel({
                    WebIFC,
                    data,
                    xktModel,
                    wasmPath: WASM_PATH,
                    autoNormals: true,
                    log: (msg) => console.log(msg)
                });

                xktModel.finalize();

                setProgress(85);
                setStatus("Gerando arquivo .xkt...", "");

                const xktArrayBuffer = writeXKTModelToArrayBuffer(
                    xktModel,
                    null,
                    {},
                    {
                        pako,
                        zip: ZIP_OUTPUT
                    }
                );
                const outputName = `${baseNameWithoutExtension(selectedFile.name) || "modelo"}.xkt`;

                downloadArrayBuffer(xktArrayBuffer, outputName);

                setProgress(100);
                setStatus(`Conversão concluída! Arquivo salvo: ${outputName}`, "ok");
            } catch (error) {
                console.error("Falha na conversão IFC → XKT", error);
                setProgress(0);
                setStatus(
                    `Erro ao converter: ${error?.message || error}. Verifique se o IFC é válido e tente novamente.`,
                    "error"
                );
            } finally {
                convertButton.disabled = !selectedFile;
            }
        }

        Promise.all([
            loadXktUtils(),
            ...(ZIP_OUTPUT ? [loadPakoUtils()] : [])
        ]).catch((error) => {
            console.error("Falha ao carregar bibliotecas de conversão", error);
            setStatus(
                "Não foi possível carregar as bibliotecas de conversão IFC/XKT. Recarregue a página ou tente novamente mais tarde.",
                "error"
            );
        });

        ifcFileInput.addEventListener("change", (event) => {
            const file = event.target.files?.[0] || null;
            updateSelectedFile(file);
            setProgress(0);
            setStatus("");
        });

        convertButton.addEventListener("click", convertIfcToXkt);

        dropzone.addEventListener("dragover", (event) => {
            event.preventDefault();
            dropzone.classList.add("dragover");
        });

        dropzone.addEventListener("dragleave", () => {
            dropzone.classList.remove("dragover");
        });

        dropzone.addEventListener("drop", (event) => {
            event.preventDefault();
            dropzone.classList.remove("dragover");
            const file = event.dataTransfer?.files?.[0] || null;
            if (!file) {
                return;
            }

            if (!file.name.toLowerCase().endsWith(".ifc")) {
                setStatus("Selecione apenas arquivos com extensão .ifc.", "error");
                return;
            }

            const dataTransfer = new DataTransfer();
            dataTransfer.items.add(file);
            ifcFileInput.files = dataTransfer.files;
            updateSelectedFile(file);
            setProgress(0);
            setStatus("");
        });
    </script>
</body>
</html>
