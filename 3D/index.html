<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D | Escolha do Projeto</title>
    <link rel="icon" href="/images/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/images/favicon-32x32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/images/favicon-16x16.png" sizes="16x16" />
    <style>
        :root {
            color-scheme: light;
            --bg: #0f172a;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #475569;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --border: #cbd5e1;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: radial-gradient(circle at top, #1e293b, var(--bg));
            color: var(--text);
        }

        .selector-card {
            width: min(100%, 560px);
            background: var(--card);
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.25);
            padding: 28px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 1.8rem;
        }

        p {
            margin: 0 0 20px;
            color: var(--muted);
            line-height: 1.4;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .controls {
            display: grid;
            gap: 12px;
        }

        select,
        button {
            width: 100%;
            border-radius: 10px;
            font-size: 1rem;
        }

        select {
            border: 1px solid var(--border);
            padding: 12px;
            background: #fff;
        }

        button {
            border: 0;
            padding: 13px;
            cursor: pointer;
            color: #fff;
            font-weight: 700;
            background: var(--accent);
            transition: background 0.2s ease;
        }

        button:hover {
            background: var(--accent-hover);
        }

        .quick-links {
            margin-top: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .quick-links a {
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 999px;
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <main class="selector-card" aria-labelledby="tituloPagina">
        <h1 id="tituloPagina">Visualizador 3D</h1>
        <p>No índice da pasta <strong>/3D</strong> você apenas escolhe para qual HTML deseja ir.</p>

        <div class="controls">
            <label for="pagina3d">Escolha o projeto</label>
            <select id="pagina3d" aria-label="Escolher página HTML do projeto 3D">
                <option value="" selected disabled>Selecione um projeto</option>
                <option value="iper.html">IPER</option>
                <option value="lacen.html">LACEN</option>
                <option value="policlinica.html">Policlínica</option>
                <option value="esc_canaa.html">Escola Canaã</option>
                <option value="farmacia.html">Farmácia do Jânio</option>
            </select>
            <button id="irProjeto" type="button">Abrir projeto</button>
        </div>

        <nav class="quick-links" aria-label="Acessos rápidos">
            <a href="iper.html">IPER</a>
            <a href="lacen.html">LACEN</a>
            <a href="policlinica.html">Policlínica</a>
            <a href="esc_canaa.html">Escola Canaã</a>
            <a href="farmacia.html">Farmácia do Jânio</a>
        </nav>
    </main>

    <script>
        const selectProjeto = document.getElementById('pagina3d');
        const botaoIr = document.getElementById('irProjeto');

        botaoIr.addEventListener('click', () => {
            if (!selectProjeto.value) {
                selectProjeto.focus();
                return;
            }
            window.location.href = selectProjeto.value;
        });

        selectProjeto.addEventListener('change', () => {
            botaoIr.textContent = `Abrir ${selectProjeto.options[selectProjeto.selectedIndex].text}`;
        });
    </script>
</body>
</html>
