<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EngRodrigo BIM - Editor BIM simplificado</title><link rel="stylesheet" href="./css/style.css"><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}</script></head><body>
<div class="app-shell"><header class="topbar"><div class="brand"><strong>EngRodrigo BIM</strong><span>Editor BIM simplificado</span></div><nav class="actions" aria-label="Ações principais"><button id="newProject" title="Novo projeto">Novo projeto</button><button id="saveProject" title="Salvar no navegador">Salvar</button><button id="exportJson" title="Exportar projeto JSON">Exportar projeto</button><label class="button file" title="Importar projeto JSON">Importar projeto<input id="importJson" type="file" accept="application/json,.json"></label><button id="exportIfc" class="primary" title="Exportar IFC">Exportar IFC</button><button id="undo" title="Desfazer">↶ Desfazer</button><button id="redo" title="Refazer">↷ Refazer</button><button id="deleteSelected" title="Excluir selecionada">Excluir</button></nav><nav class="view-tabs" aria-label="Visualizações"><button data-view="plan" class="active">Planta 2D</button><button data-view="three">Visualização 3D</button><button data-view="split">Tela dividida</button></nav></header>
<main class="workspace"><aside class="panel left"><button class="collapse" data-target="left" aria-label="Recolher painel esquerdo">☰</button><section><h2>Propriedades</h2><label>Nome do projeto<input id="projectName" type="text"></label><label>Ferramenta ativa<input id="activeToolLabel" type="text" readonly></label><div class="tools"><button id="toolSelect">Selecionar</button><button id="toolWall" class="active">Parede</button><button id="orthoToggle">Orto</button></div><label>Altura padrão (m)<input id="defaultHeight" type="number" min="0.01" step="0.01"></label><label>Espessura padrão (m)<input id="defaultThickness" type="number" min="0.01" step="0.01"></label><label>Elevação da base (m)<input id="defaultBase" type="number" step="0.01"></label><label>Passo do snap (m)<input id="snapStep" type="number" min="0.01" step="0.01"></label><label class="check"><input id="showGrid" type="checkbox"> Mostrar grade</label><label class="check"><input id="snapEnabled" type="checkbox"> Ativar snap</label><button id="deleteSelectedSide">Excluir selecionada</button></section><section id="selectedPanel"><h2>Selecionada</h2><p class="muted">Nenhuma parede selecionada.</p></section></aside>
<section class="canvas-area"><div id="planView" class="view"><canvas id="planCanvas" aria-label="Planta baixa 2D"></canvas></div><div id="threeView" class="view hidden"><canvas id="threeCanvas" aria-label="Visualização 3D"></canvas></div><div id="toast" role="status" aria-live="polite"></div></section>
<aside class="panel right"><button class="collapse" data-target="right" aria-label="Recolher painel direito">☰</button><h2>Projeto</h2><ul class="tree"><li>▾ <span id="treeProjectName">Projeto</span><ul><li>▾ Pavimento térreo<ul><li>▾ Paredes <span id="wallCount">0</span><ul id="wallTree"></ul></li></ul></li></ul></li></ul></aside></main>
<footer class="statusbar"><span id="coordX">X: 0,00</span><span id="coordY">Y: 0,00</span><span id="tempLength">Comprimento: —</span><span id="snapStatus">Snap: ligado</span><span>Unidade: m</span><span id="toolStatus">Ferramenta: Parede</span></footer></div>
<script type="module" src="./js/app.js"></script></body></html>
